name: Assemble Android
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string

jobs:
  package-android-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: '*_android_*'
          path: package/libraries
          merge-multiple: true
      # Upload the raw folder rather than a pre-made zip: actions/upload-artifact always wraps
      # whatever it's given in its own zip, so uploading a zip here results in a zip nested inside
      # that zip once a human downloads the artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-jvm_gdextension_android
          path: package
