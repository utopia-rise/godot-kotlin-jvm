name: 🪟 Windows Exports Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string
      build-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows_exports_tests
  cancel-in-progress: true

jobs:
  test-windows-exports:
    runs-on: windows-latest
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: release tests
            target: release
            jvm-target: release
            build-task: buildRelease

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: 4.7.1-stable
          platform: windows
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Download windows editor library
        uses: actions/download-artifact@v7
        with:
          name: debug_windows_x86_64
          path: './harness/tests/addons'

      - name: Download windows export library
        uses: actions/download-artifact@v7
        with:
          name: release_windows_x86_64
          path: './harness/tests/addons'

      - name: Prepare export
        run: |
          mkdir -p harness/tests/export
          curl.exe --fail --location https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz --output templates.tpz
          Expand-Archive templates.tpz templates
          Move-Item templates/templates/windows_${{ matrix.jvm-target }}_x86_64.exe harness/tests/godot.windows.template_${{ matrix.jvm-target }}.x86_64.exe
          Move-Item templates/templates/windows_${{ matrix.jvm-target }}_x86_64_console.exe harness/tests/godot.windows.template_${{ matrix.jvm-target }}.x86_64.console.exe

      - name: Build tests project
        run: |
          harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Create JRE
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-windows

      - name: Export tests release
        run: |
          cd harness/tests/
          ./gradlew exportRelease
        timeout-minutes: 30

      - name: Run Tests
        run: |
          cd harness/tests/
          ./gradlew runExportedGDTests
        timeout-minutes: 30
