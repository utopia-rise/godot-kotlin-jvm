name: 🐧 Linux Exports Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string
      build-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-linux_exports_tests
  cancel-in-progress: true

jobs:
  test-linux-exports:
    runs-on: ubuntu-22.04 # run tests on oldest ubuntu we still support. See build_linux.yml
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: release tests
            target: release
            jvm-target: release
            build-task: buildRelease

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: 4.7.1-stable
          platform: linux
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Download linux editor library
        uses: actions/download-artifact@v7
        with:
          name: debug_linux_x86_64
          path: './harness/tests/addons'

      - name: Download linux export library
        uses: actions/download-artifact@v7
        with:
          name: release_linux_x86_64
          path: './harness/tests/addons'

      - name: Prepare export
        run: |
          chmod +x harness/tests/bin/godot.*
          mkdir -p harness/tests/export
          curl --fail --location https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz --output templates.tpz
          unzip -q templates.tpz -d templates
          mv templates/templates/linux_${{ matrix.jvm-target }}.x86_64 harness/tests/godot.linuxbsd.template_${{ matrix.jvm-target }}.x86_64

      - name: Build tests project
        run: |
          harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Create JRE
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-amd64-linux

      - name: Export tests release
        run: |
          cd harness/tests/
          ./gradlew exportRelease
        timeout-minutes: 30

      - name: Run Tests
        run: |
          cd harness/tests/
          ./gradlew runExportedGDTests
        timeout-minutes: 30
