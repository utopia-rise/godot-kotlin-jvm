name: 🍎 MacOS Exports Tests
on:
  workflow_call:
    inputs:
      godot-version:
        type: string
      jvm-version:
        type: string
      build-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-macos_exports_tests
  cancel-in-progress: true

jobs:
  test-macos-exports:
    runs-on: macos-15
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: release tests
            target: release
            jvm-target: release
            build-task: buildRelease

    steps:
      - name: Clone Godot JVM module.
        uses: actions/checkout@v6

      - uses: ./.github/actions/download-godot
        with:
          version: 4.7.1-stable
          platform: macos
          destination: harness/tests/bin

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Download macos editor library
        uses: actions/download-artifact@v7
        with:
          name: debug_macos_universal
          path: './harness/tests/addons'

      - name: Download macos export library
        uses: actions/download-artifact@v7
        with:
          name: release_macos_universal
          path: './harness/tests/addons'

      - name: Prepare export
        run: |
          chmod +x harness/tests/bin/godot.*
          mkdir -p harness/tests/export
          curl --fail --location https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz --output templates.tpz
          unzip -q templates.tpz -d templates
          mv templates/templates/macos.zip harness/tests/export_template_all_macos.zip

      - name: Build tests project
        run: |
          harness/tests/gradlew -p harness/tests/ ${{ matrix.build-task }}

      - name: Create JRE
        run: |
          cd harness/tests/
          jlink --add-modules java.base,java.logging --output jvm/jre-arm64-macos
          mkdir jvm/jre-amd64-macos #create a fake jre dir for amd64 so the export is happy. The test will run on arm anyways

      - name: Export tests release
        run: |
          cd harness/tests/
          ./gradlew exportRelease
        timeout-minutes: 30

      - name: Extract app from dmg
        run: |
          cd harness/tests/export
          hdiutil attach tests.dmg
          cp -a /Volumes/Godot\ Kotlin\ Tests/Godot\ Kotlin\ Tests.app Godot\ Kotlin\ Tests.app
          hdiutil detach /Volumes/Godot\ Kotlin\ Tests

      - name: Run Tests
        run: |
          cd harness/tests/
          ./gradlew runExportedGDTests
        timeout-minutes: 30
