name: Assemble macOS
on:
  workflow_call:
    inputs:
      godot-kotlin-jvm-version:
        type: string
      godot-version:
        type: string
      build-version:
        type: string

concurrency:
  group: ci-${{ github.actor }}-${{ github.head_ref || github.run_number }}-${{ github.ref }}-macos_assemble
  cancel-in-progress: true

jobs:
  create-macos-universal-libraries:
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - artifact: release
            target: template_release
            output: release
          # Must match build_macos.yml's debug matrix entry, which builds target=editor.
          - artifact: debug
            target: editor
            output: debug
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}_macos_x86_64
          path: x86_64
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}_macos_arm64
          path: arm64
      - name: Create universal GDExtension library
        shell: bash
        run: |
          mkdir -p artifact/addons/jvm/libs/macos
          cp -R x86_64/jvm/libs/macos/godot.jvm.macos.${{ matrix.target }}.framework artifact/addons/jvm/libs/macos/
          lipo -create x86_64/jvm/libs/macos/godot.jvm.macos.${{ matrix.target }}.framework/godot.jvm.macos.${{ matrix.target }} arm64/jvm/libs/macos/godot.jvm.macos.${{ matrix.target }}.framework/godot.jvm.macos.${{ matrix.target }} -output artifact/addons/jvm/libs/macos/godot.jvm.macos.${{ matrix.target }}.framework/godot.jvm.macos.${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}_macos_universal
          path: artifact/addons

  package-macos-libraries:
    needs: create-macos-universal-libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [debug, release]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.target }}_macos_universal
          path: libraries
      - run: |
          mkdir -p package/addons
          cp -R libraries/jvm package/addons/jvm
          cd package
          zip -q -9 -r ../godot-kotlin-jvm_gdextension_macos_universal_${{ matrix.target }}_${{ inputs.godot-kotlin-jvm-version }}.zip addons
      - uses: actions/upload-artifact@v7
        with:
          name: godot-kotlin-jvm_gdextension_macos_universal_${{ matrix.target }}_${{ inputs.godot-kotlin-jvm-version }}.zip
          path: godot-kotlin-jvm_gdextension_macos_universal_${{ matrix.target }}_${{ inputs.godot-kotlin-jvm-version }}.zip
