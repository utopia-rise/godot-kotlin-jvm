name: 🪟 Assemble Windows
on:
  workflow_call:
    inputs:
      godot-kotlin-jvm-version:
        type: string
      godot-version:
        type: string
      build-version:
        type: string

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-windows_assemble
  cancel-in-progress: true

jobs:
  create-windows-library-zip:
    # does not need to run on windows -> only packs a zip
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Create release library zip
            target: release
            arch: x86_64

          - name: Create debug library zip
            target: debug
            arch: x86_64
    steps:
      - name: Download ${{ matrix.target }} library
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.target }}_windows_${{ matrix.arch }}
          path: godot-kotlin-jvm_gdextension_windows_${{ matrix.arch }}_${{ matrix.target }}_${{ inputs.godot-kotlin-jvm-version }}

      - name: Assemble Windows library
        run: |
          mkdir -p package/addons
          cp -R godot-kotlin-jvm_gdextension_windows_${{ matrix.arch }}_${{ matrix.target }}_${{ inputs.godot-kotlin-jvm-version }}/jvm package/addons/jvm
        shell: bash

      # Upload the raw "addons" folder rather than a pre-made zip: actions/upload-artifact always
      # wraps whatever it's given in its own zip, so uploading a zip here results in a zip nested
      # inside that zip once a human downloads the artifact. The actual release-asset zip gets made
      # once, at the point deploy_godot.yml attaches it to the GitHub release.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-kotlin-jvm_gdextension_windows_${{ matrix.arch }}_${{ matrix.target }}_${{ inputs.godot-kotlin-jvm-version }}
          path: package
