name: Setup SCons cache
description: Restores the latest master SCons cache and writes only from master.
inputs:
  cache-name:
    description: Cache name for one platform, architecture, and target.
    default: ${{ github.job }}
  scons-cache:
    description: SCons cache path.
    default: ${{ github.workspace }}/.scons-cache

runs:
  using: composite
  steps:
    - name: Restore master SCons cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.scons-cache }}
        key: scons-${{ inputs.cache-name }}-master-${{ github.sha }}
        restore-keys: |
          scons-${{ inputs.cache-name }}-master-
    - name: Save master SCons cache
      if: ${{ github.ref == 'refs/heads/master' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.scons-cache }}
        key: scons-${{ inputs.cache-name }}-master-${{ github.sha }}
